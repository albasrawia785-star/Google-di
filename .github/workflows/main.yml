name: Build Android APK with Persistent Signing & Auto Updates

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pre-Clean Conflicting Configurations
        run: |
          rm -rf capacitor.config.ts capacitor.config.json

      - name: Unzip Project Files If Needed
        run: |
          if [ -f "pos.zip--صيدلي-برو" ] || ls *.zip 1> /dev/null 2>&1; then
            unzip "pos.zip--صيدلي-برو" -d temp_unzip 2>/dev/null || unzip *.zip -d temp_unzip 2>/dev/null || true
            TARGET_DIR=$(find temp_unzip -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              echo "Found project files in: $TARGET_DIR"
              cp -r $TARGET_DIR/* .
            fi
            rm -rf temp_unzip
          fi

      - name: Deep Clean Environment
        run: |
          rm -rf node_modules package-lock.json dist android
          find . -name "capacitor.config.ts" -delete
          find . -name "capacitor.config.json" -delete

      - name: Set up Python for Military Encryption
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Smart Encrypt & Inject Database Credentials
        env:
          RAW_TURSO_URL: ${{ secrets.TURSO_URL || '' }}
          RAW_TURSO_TOKEN: ${{ secrets.TURSO_TOKEN || '' }}
        run: |
          python3 -c "
          import os, re, json

          raw_url = os.environ.get('RAW_TURSO_URL', '').strip()
          raw_token = os.environ.get('RAW_TURSO_TOKEN', '').strip()

          aldion_path = 'aldion.ts'
          if not os.path.exists(aldion_path):
              aldion_path = 'src/aldion.ts'

          if raw_url and raw_token:
              print('🔒 تم العثور على توكن في الـ YAML -> جاري التشفير والحقن في aldion.ts...')
              url_key = [83, 183, 31, 140, 66, 158, 97, 170, 53, 212]
              token_key = [155, 77, 226, 26, 119, 60, 245, 134, 41, 161, 100, 216]

              def encrypt_bytes(text, key, salt=7):
                  return [(ord(c) ^ key[i % len(key)] ^ ((i * salt) & 0xFF)) & 0xFF for i, c in enumerate(text)]

              enc_url_bytes = encrypt_bytes(raw_url, url_key)
              enc_token_bytes = encrypt_bytes(raw_token, token_key)

              if os.path.exists(aldion_path):
                  with open(aldion_path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  content = re.sub(
                      r'const _CIPHER_TOKEN_BYTES:\s*number\[\]\s*=\s*\[[\s\S]*?\];',
                      f'const _CIPHER_TOKEN_BYTES: number[] = {json.dumps(enc_token_bytes)};',
                      content
                  )

                  content = re.sub(
                      r'const _CIPHER_URL_BYTES:\s*number\[\]\s*=\s*\[[\s\S]*?\];',
                      f'const _CIPHER_URL_BYTES: number[] = {json.dumps(enc_url_bytes)};',
                      content
                  )

                  content = re.sub(r'export const MANUAL_OVERRIDE_TURSO_URL:\s*string\s*=\s*[\"|\'].*?[\"|\'];', 'export const MANUAL_OVERRIDE_TURSO_URL: string = \"\";', content)
                  content = re.sub(r'export const MANUAL_OVERRIDE_TURSO_TOKEN:\s*string\s*=\s*[\"|\'].*?[\"|\'];', 'export const MANUAL_OVERRIDE_TURSO_TOKEN: string = \"\";', content)

                  with open(aldion_path, 'w', encoding='utf-8') as f:
                      f.write(content)

                  print('✅ تم تشفير التوكن والرابط بنجاح وحقنهما في المشروع!')
              else:
                  print('⚠️ تنبيه: لم يتم العثور على ملف aldion.ts.')
          else:
              print('⚡ لم يتم إدخال توكن في الـ YAML -> سيتم استخدام التوكن وقاعدة البيانات الموجودة مسبقاً داخل ملفات المشروع.')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: |
          npm install --force

      - name: Build Web Application
        run: |
          npm run build
          if [ ! -f "dist/index.html" ]; then
            echo "⚠️ dist/index.html missing! Checking for nested dist folders..."
            FOUND_INDEX=$(find . -name "index.html" | grep "dist" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              FOUND_DIR=$(dirname "$FOUND_INDEX")
              echo "Found index.html in $FOUND_DIR, copying to dist..."
              mkdir -p dist
              cp -r $FOUND_DIR/* dist/
            fi
          fi
          echo "✅ Built web app successfully. dist/index.html verified!"

      - name: Install Native Capacitor Plugins
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/filesystem@latest @capacitor/share@latest @capacitor/splash-screen@latest @capacitor/haptics@latest @capacitor-community/sqlite@latest

      - name: Inject Universal Native Download & Share Interceptor
        run: |
          cat << 'EOF' > dist/inject_share.js
          (function() {
            const originalCreate = URL.createObjectURL;
            URL.createObjectURL = function(blob) {
              const url = originalCreate.call(this, blob);
              if (blob && (blob.type.includes('json') || blob.type.includes('pdf') || blob.type.includes('octet') || blob.type.includes('text') || blob.type.includes('html'))) {
                const reader = new FileReader();
                reader.onloadend = async function() {
                  if (reader.result) {
                    const base64Data = reader.result.split(',')[1];
                    if (base64Data) {
                      const isJson = blob.type.includes('json');
                      const isHtml = blob.type.includes('html');
                      const ext = isJson ? 'json' : (isHtml ? 'html' : 'pdf');
                      const mime = isJson ? 'application/json' : (isHtml ? 'text/html' : 'application/pdf');
                      triggerNativeShare(base64Data, ext, mime);
                    }
                  }
                };
                reader.readAsDataURL(blob);
              }
              return url;
            };

            document.addEventListener('click', function(e) {
              const anchor = e.target.closest('a[download]');
              if (anchor && anchor.href) {
                const downloadName = anchor.download || '';
                const isJson = downloadName.toLowerCase().endsWith('.json');
                const isHtml = downloadName.toLowerCase().endsWith('.html') || downloadName.toLowerCase().endsWith('.htm');
                const ext = isJson ? 'json' : (isHtml ? 'html' : 'pdf');
                const mime = isJson ? 'application/json' : (isHtml ? 'text/html' : 'application/pdf');

                if (anchor.href.startsWith('data:')) {
                  const parts = anchor.href.split(',');
                  if (parts.length > 1) {
                    triggerNativeShare(parts[1], ext, mime, downloadName);
                  }
                } else if (anchor.href.startsWith('blob:')) {
                  fetch(anchor.href).then(function(res) {
                    return res.blob();
                  }).then(function(blob) {
                    const reader = new FileReader();
                    reader.onloadend = function() {
                      if (reader.result) {
                        const base64Data = reader.result.split(',')[1];
                        if (base64Data) {
                          triggerNativeShare(base64Data, ext, mime, downloadName);
                        }
                      }
                    };
                    reader.readAsDataURL(blob);
                  }).catch(function(err) {
                    console.log('Blob fetch error:', err);
                  });
                }
              }
            }, true);

            async function triggerNativeShare(base64Data, ext, mimeType, customFileName) {
              const dateStr = new Date().toISOString().slice(0, 10);
              const extension = ext || 'pdf';
              const isJson = extension === 'json';
              const fileName = customFileName || (isJson ? `Daftar-Aldeyon-Backup-${dateStr}.json` : `Daftar-Aldeyon-Report-${dateStr}.${extension}`);

              try {
                if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
                  const { Filesystem, Share } = window.Capacitor.Plugins;

                  const savedFile = await Filesystem.writeFile({
                    path: fileName,
                    data: base64Data,
                    directory: 'CACHE'
                  });

                  await Share.share({
                    title: isJson ? 'النسخة الاحتياطية' : 'تقرير كشف الحساب',
                    text: isJson ? 'ملف النسخة الاحتياطية - دفتر الديون' : 'تقرير كشف الحساب - دفتر الديون',
                    url: savedFile.uri,
                    dialogTitle: isJson ? 'حفظ أو مشاركة النسخة الاحتياطية' : 'مشاركة أو حفظ التقرير'
                  });
                } else if (navigator.share) {
                  try {
                    const byteChars = atob(base64Data);
                    const byteNumbers = new Array(byteChars.length);
                    for (let i = 0; i < byteChars.length; i++) {
                      byteNumbers[i] = byteChars.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const file = new File([byteArray], fileName, { type: mimeType || (isJson ? 'application/json' : 'application/pdf') });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                      await navigator.share({
                        files: [file],
                        title: isJson ? 'النسخة الاحتياطية' : 'تقرير كشف الحساب',
                        text: isJson ? 'ملف النسخة الاحتياطية' : 'تقرير كشف الحساب',
                      });
                    }
                  } catch (webShareErr) {
                    console.log('WebShare API fallback:', webShareErr);
                  }
                }
              } catch (err) {
                console.log('Native Share Failed:', err);
              }
            }
          })();
          EOF

          if [ -f "dist/index.html" ]; then
            sed -i '/<\/head>/i \  <script src="./inject_share.js"><\/script>' dist/index.html
          fi

      - name: Initialize Capacitor Android & Inject Configuration
        run: |
          APP_NAME="دفتر الديون"
          PACKAGE_ID="com.aistudio.debttracker.iqdb"

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.aistudio.debttracker.iqdb",
            "appName": "دفتر الديون",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF

          npx cap add android || true
          npx cap copy android
          npx cap sync android

          # Ensure dist/index.html is copied into android assets public directory
          ASSETS_DIR="android/app/src/main/assets/public"
          mkdir -p "$ASSETS_DIR"
          cp -r dist/* "$ASSETS_DIR/"
          echo "✅ Verified local asset bundle in $ASSETS_DIR:"
          ls -la "$ASSETS_DIR"

      - name: Optimize Native Android Manifest & Safe Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i 's/android:debuggable="false"//g' $MANIFEST_PATH
            sed -i 's/android:debuggable="true"//g' $MANIFEST_PATH
            sed -i 's/<application/<application android:hardwareAccelerated="true" android:largeHeap="true" android:extractNativeLibs="true"/g' $MANIFEST_PATH
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />' $MANIFEST_PATH
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i '/android {/a \    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }' android/app/build.gradle
          fi

      - name: Inject Google Drive, WhatsApp Intent & File Picker into MainActivity
        run: |
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            PACKAGE_LINE=$(grep "^package " "$MAIN_ACTIVITY" | head -n 1)
            cat << JAVAEOF > "$MAIN_ACTIVITY"
          ${PACKAGE_LINE}

          import android.os.Bundle;
          import android.os.Build;
          import android.os.Message;
          import android.app.Dialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.view.WindowManager;
          import android.view.Display;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private ValueCallback<Uri[]> mFilePathCallback = null;
              private Uri mCameraPhotoUri = null;
              private WebChromeClient.FileChooserParams mLastFileChooserParams = null;
              private static final int FILE_CHOOSER_REQUEST_CODE = 2001;
              private static final int STORAGE_PERMISSION_REQUEST_CODE = 2002;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          getWindow().setDecorFitsSystemWindows(true);
                      }
                      if (getWindow() != null && getWindow().getDecorView() != null) {
                          getWindow().getDecorView().setFitsSystemWindows(true);
                      }
                  } catch (Exception ignored) {}

                  try {
                      if (this.bridge != null && this.bridge.getWebView() != null) {
                          WebView webView = this.bridge.getWebView();
                          WebSettings settings = webView.getSettings();
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                          settings.setAllowFileAccess(true);
                          settings.setAllowContentAccess(true);
                          settings.setJavaScriptEnabled(true);
                          settings.setJavaScriptCanOpenWindowsAutomatically(true);
                          settings.setSupportMultipleWindows(true);

                          String chromeUa = "Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.6613.88 Mobile Safari/537.36";
                          settings.setUserAgentString(chromeUa);

                          webView.setLayerType(WebView.LAYER_TYPE_HARDWARE, null);

                          // Intercept WhatsApp URLs and launch WhatsApp app directly
                          webView.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView view, String url) {
                                  if (url != null && (url.startsWith("whatsapp://") || url.contains("api.whatsapp.com") || url.contains("wa.me"))) {
                                      try {
                                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                          startActivity(intent);
                                          return true;
                                      } catch (Exception e) {
                                          try {
                                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                              startActivity(intent);
                                              return true;
                                          } catch (Exception ex) {
                                              return false;
                                          }
                                      }
                                  }
                                  return false;
                              }
                          });

                          // Handle Camera, Gallery & Google Drive Popups
                          webView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                                  if (mFilePathCallback != null) {
                                      mFilePathCallback.onReceiveValue(null);
                                      mFilePathCallback = null;
                                  }
                                  mFilePathCallback = filePathCallback;

                                  boolean isCapture = (fileChooserParams != null && fileChooserParams.isCaptureEnabled());

                                  java.util.List<String> perms = new java.util.ArrayList<>();
                                  if (isCapture) {
                                      if (ContextCompat.checkSelfPermission(MainActivity.this, android.Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                          perms.add(android.Manifest.permission.CAMERA);
                                      }
                                  } else {
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                          if (ContextCompat.checkSelfPermission(MainActivity.this, android.Manifest.permission.READ_MEDIA_IMAGES) != PackageManager.PERMISSION_GRANTED) {
                                              perms.add(android.Manifest.permission.READ_MEDIA_IMAGES);
                                          }
                                      } else {
                                          if (ContextCompat.checkSelfPermission(MainActivity.this, android.Manifest.permission.READ_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                                              perms.add(android.Manifest.permission.READ_EXTERNAL_STORAGE);
                                          }
                                      }
                                  }

                                  if (!perms.isEmpty()) {
                                      mLastFileChooserParams = fileChooserParams;
                                      ActivityCompat.requestPermissions(MainActivity.this, perms.toArray(new String[0]), STORAGE_PERMISSION_REQUEST_CODE);
                                      return true;
                                  }

                                  launchImagePicker(fileChooserParams);
                                  return true;
                              }

                              @Override
                              public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                                  WebView popupWebView = new WebView(MainActivity.this);
                                  WebSettings popupSettings = popupWebView.getSettings();
                                  popupSettings.setJavaScriptEnabled(true);
                                  popupSettings.setDomStorageEnabled(true);
                                  popupSettings.setDatabaseEnabled(true);
                                  popupSettings.setSupportMultipleWindows(true);
                                  popupSettings.setJavaScriptCanOpenWindowsAutomatically(true);
                                  popupSettings.setUserAgentString(chromeUa);

                                  Dialog authDialog = new Dialog(MainActivity.this, android.R.style.Theme_Black_NoTitleBar_Fullscreen);
                                  authDialog.setContentView(popupWebView);
                                  authDialog.show();

                                  popupWebView.setWebChromeClient(new WebChromeClient() {
                                      @Override
                                      public void onCloseWindow(WebView window) {
                                          try {
                                              authDialog.dismiss();
                                          } catch (Exception ignored) {}
                                      }
                                  });

                                  popupWebView.setWebViewClient(new WebViewClient() {
                                      @Override
                                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                                          if (url != null && (url.startsWith("whatsapp://") || url.contains("api.whatsapp.com") || url.contains("wa.me"))) {
                                              try {
                                                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                                  startActivity(intent);
                                                  return true;
                                              } catch (Exception ignored) {}
                                          }
                                          return false;
                                      }
                                  });

                                  WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                                  transport.setWebView(popupWebView);
                                  resultMsg.sendToTarget();
                                  return true;
                              }
                          });
                      }
                  } catch (Exception ignored) {}
              }

              private void launchImagePicker(WebChromeClient.FileChooserParams fileChooserParams) {
                  try {
                      boolean isCapture = (fileChooserParams != null && fileChooserParams.isCaptureEnabled());

                      Intent takePictureIntent = null;
                      try {
                          takePictureIntent = new Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                          java.io.File storageDir = getExternalCacheDir();
                          if (storageDir == null) storageDir = getCacheDir();
                          java.io.File photoFile = java.io.File.createTempFile("invoice_cam_", ".jpg", storageDir);
                          mCameraPhotoUri = androidx.core.content.FileProvider.getUriForFile(
                              MainActivity.this,
                              getPackageName() + ".fileprovider",
                              photoFile
                          );
                          takePictureIntent.putExtra(android.provider.MediaStore.EXTRA_OUTPUT, mCameraPhotoUri);
                          takePictureIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      } catch (Exception ex) {
                          takePictureIntent = null;
                      }

                      if (isCapture && takePictureIntent != null) {
                          startActivityForResult(takePictureIntent, FILE_CHOOSER_REQUEST_CODE);
                          return;
                      }

                      Intent galleryIntent = new Intent(Intent.ACTION_GET_CONTENT);
                      galleryIntent.addCategory(Intent.CATEGORY_OPENABLE);
                      galleryIntent.setType("image/*");

                      Intent chooserIntent = Intent.createChooser(galleryIntent, "التقاط بالكاميرا أو اختيار من المعرض");
                      if (takePictureIntent != null) {
                          chooserIntent.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{takePictureIntent});
                      }

                      startActivityForResult(chooserIntent, FILE_CHOOSER_REQUEST_CODE);
                  } catch (Exception e) {
                      if (mFilePathCallback != null) {
                          mFilePathCallback.onReceiveValue(null);
                          mFilePathCallback = null;
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == STORAGE_PERMISSION_REQUEST_CODE) {
                      if (grantResults != null && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                          launchImagePicker(mLastFileChooserParams);
                      } else {
                          try {
                              launchImagePicker(mLastFileChooserParams);
                          } catch (Exception e) {
                              if (mFilePathCallback != null) {
                                  mFilePathCallback.onReceiveValue(null);
                                  mFilePathCallback = null;
                              }
                          }
                      }
                      mLastFileChooserParams = null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (mFilePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == RESULT_OK) {
                          if (data != null && data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          } else if (data != null && data.getClipData() != null) {
                              int numSelected = data.getClipData().getItemCount();
                              results = new Uri[numSelected];
                              for (int i = 0; i < numSelected; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (mCameraPhotoUri != null) {
                              results = new Uri[]{mCameraPhotoUri};
                          }
                      }
                      mFilePathCallback.onReceiveValue(results);
                      mFilePathCallback = null;
                  }
              }
          }
          JAVAEOF
            echo "✅ تم دعم أصول التطبيق والواتساب بنجاح!"
          fi

      - name: Generate Multi-Resolution App Icons
        run: |
          python3 -m pip install pillow
          python3 -c "
          import os
          from PIL import Image

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          icon_path = 'icon.png'
          if not os.path.exists(icon_path):
              icon_path = 'public/icon.png'

          if os.path.exists(icon_path):
              img = Image.open(icon_path).convert('RGBA')
              res_dir = 'android/app/src/main/res'
              
              for folder, size in sizes.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  
                  for fname in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                      resized.save(os.path.join(target_dir, fname))
              print('Successfully generated launcher icons!')
          "

      - name: Update Kotlin & Gradle Versions for Java 21
        run: |
          cd android
          if [ -f "build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = \"1.9.24\"/g' build.gradle
            sed -i 's/kotlin_version = .*/kotlin_version = \"1.9.24\"/g' build.gradle
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Sign Release APK with Persistent Key
        run: |
          cd android
          chmod +x gradlew

          if [ -f "../daftar_release.keystore" ]; then
            cp ../daftar_release.keystore release.keystore
            echo "✅ تم استخدام المفتاح الثابت: daftar_release.keystore"
          elif [ -f "../release.keystore" ]; then
            cp ../release.keystore release.keystore
            echo "✅ تم استخدام المفتاح الثابت: release.keystore"
          else
            echo "⚠️ لم يتم العثور على المفتاح، جاري توليد المفتاح..."
            keytool -genkeypair -v -keystore release.keystore -alias daftar_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "DaftarPass2026" -keypass "DaftarPass2026" -dname "CN=DaftarAldeyon, OU=App, O=Daftar, L=Baghdad, S=Baghdad, C=IQ" -storetype PKCS12
          fi

          RUN_NUM=${{ github.run_number }}
          if [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode 1/versionCode $RUN_NUM/g" app/build.gradle || true
          fi

          ./gradlew assembleRelease --no-daemon -Dorg.gradle.project.android.useAndroidX=true

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          DATE_STR=$(date +'%Y-%m-%d')
          FINAL_APK_NAME="Daftar-Aldeyon-${DATE_STR}-v${RUN_NUM}.apk"
          
          TARGET_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" ! -name "Daftar-Aldeyon-*" | head -n 1)
          if [ -z "$TARGET_APK" ]; then
            TARGET_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          echo "جاري توقيع الملف: $TARGET_APK"
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:"DaftarPass2026" --key-pass pass:"DaftarPass2026" --out "app/build/outputs/apk/release/${FINAL_APK_NAME}" "$TARGET_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Daftar-Aldeyon-APK
          path: android/app/build/outputs/apk/release/Daftar-Aldeyon-*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: android/app/build/outputs/apk/release/Daftar-Aldeyon-*.apk
          name: "إصدار تطبيق دفتر الديون v${{ github.run_number }}"
          tag_name: "v${{ github.run_number }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
